name: Cricket Odds Scraper

on:
  schedule:
    - cron: '*/15 * * * *' # Auto-triggers every 15 minutes
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 14 # Keeps the runner clean and prevents hanging jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright browsers & OS dependencies
        run: |
          playwright install chromium
          npx playwright install-deps chromium

      - name: Run Scraper for 10 Minutes
        run: |
          # Runs the Python scraper in the background
          python cricket_odds_scraper.py &
          SCRAPER_PID=$!
          
          # Keeps the action running for 600 seconds (10 minutes)
          sleep 600
          
          # Gracefully stops the scraper before committing
          kill $SCRAPER_PID || true

      - name: Commit and push updated odds.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add odds.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update live odds [skip ci]" && git push)
