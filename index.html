<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Odds Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      padding-bottom: 0.5rem;
    }
    .card {
      background-color: #1e293b;
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    pre {
      background-color: #090d16;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      color: #4ade80;
    }
    .status {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      background-color: #0284c7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Live Cricket Odds</h1>
    <p><span class="status" id="status">Loading...</span></p>
    
    <div class="card">
      <h3>Raw Data (`odds.json`)</h3>
      <pre id="data-display">Fetching live data...</pre>
    </div>
  </div>

  <script>
    async function fetchOdds() {
      const statusEl = document.getElementById('status');
      const dataEl = document.getElementById('data-display');

      try {
        // Fetch the statically hosted odds.json from Vercel
        const response = await fetch('/odds.json', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }
        const data = await response.json();
        
        statusEl.textContent = 'Data Live';
        statusEl.style.backgroundColor = '#16a34a';
        dataEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        statusEl.textContent = 'Failed to Load';
        statusEl.style.backgroundColor = '#dc2626';
        dataEl.textContent = `Error fetching /odds.json:\n${err.message}`;
      }
    }

    fetchOdds();
  </script>
</body>
</html>
